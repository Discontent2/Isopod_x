name: Deploy ISOPOD_X web preview

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cat docs/site_src/index_*.part > _site/index.html
          cat docs/site_src/room_*.b64 | tr -d '\n' | base64 --decode > _site/assets/room_background.webp
          cat docs/site_src/atlas_*.b64 | tr -d '\n' | base64 --decode > _site/assets/x_frames_atlas.webp
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
